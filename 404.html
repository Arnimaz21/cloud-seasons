<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена — Cloud.Seasons</title>
<meta name="description" content="Страница не найдена. Вернитесь на главную Cloud.Seasons или воспользуйтесь навигацией.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0f131c">
<link rel="icon" href="/assets/logo.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f131c;
    --surface: #151923;
    --surface-high: #1c212e;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --outline: #475569;
    --primary: #4d8bff;
    --primary-soft: #afc6ff;
    --secondary: #a78bfa;
    --tertiary: #26e19a;
    --discord: #5865F2;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }

  /* фон */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: url("/assets/background.png") center top / cover no-repeat;
    opacity: .28;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.65) 45%, transparent 92%);
    mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.65) 45%, transparent 92%);
  }
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(110px);
    pointer-events: none;
    z-index: 0;
  }
  .orb-1 { width: 520px; height: 420px; top: -140px; left: 50%; transform: translateX(-50%); background: rgba(77,139,255,.22); }
  .orb-2 { width: 420px; height: 360px; bottom: -160px; left: -120px; background: rgba(167,139,250,.14); }
  .orb-3 { width: 380px; height: 320px; top: 30%; right: -140px; background: rgba(38,225,154,.10); }

  /* контент */
  main {
    position: relative;
    z-index: 10;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 64px 20px 80px;
  }
  .code {
    margin: 0;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: clamp(110px, 24vw, 230px);
    line-height: .9;
    letter-spacing: -.06em;
    background: linear-gradient(135deg, #ffffff 0%, #b4cfff 45%, #4d8bff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 20px 50px rgba(77,139,255,.25));
    user-select: none;
  }
  h1 {
    margin: 18px 0 0;
    font-family: "Space Grotesk", sans-serif;
    font-size: clamp(24px, 4.2vw, 40px);
    font-weight: 700;
    letter-spacing: -.02em;
    color: #fff;
  }
  .lead {
    max-width: 560px;
    margin: 14px 0 0;
    font-size: 15px;
    line-height: 1.65;
    color: var(--muted);
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 30px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 24px;
    border-radius: 14px;
    font-family: "Space Grotesk", sans-serif;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform .15s, background .2s, border-color .2s, box-shadow .2s;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary {
    color: #fff;
    background: var(--primary);
    box-shadow: 0 10px 30px rgba(77,139,255,.3);
  }
  .btn-primary:hover { background: #3b7bf5; }
  .btn-ghost {
    color: var(--text);
    background: rgba(255,255,255,.05);
    border-color: rgba(255,255,255,.12);
  }
  .btn-ghost:hover { background: rgba(255,255,255,.1); }

  .quick {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 8px 22px;
    margin-top: 38px;
    padding-top: 22px;
    border-top: 1px solid rgba(255,255,255,.08);
    font-size: 13px;
    color: var(--muted);
  }
  .quick a { color: var(--primary-soft); transition: color .2s; }
  .quick a:hover { color: #fff; }

  footer {
    position: relative;
    z-index: 10;
    border-top: 1px solid rgba(255,255,255,.10);
    background: rgba(11,14,21,.95);
    padding: 20px 24px;
    font-size: 12px;
    color: var(--outline);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  footer a:hover { color: #fff; }

  @media (max-width: 860px) {
    main { padding: 48px 18px 64px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="orb orb-1" aria-hidden="true"></div>
<div class="orb orb-2" aria-hidden="true"></div>
<div class="orb orb-3" aria-hidden="true"></div>

<div id="site-header"></div>
<script src="/header.js"></script>

<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>Страница потерялась в облаках</h1>
  <p class="lead">Такой страницы нет или она была перемещена. Проверьте адрес или вернитесь на главную — там всё на месте.</p>

  <div class="actions">
    <a class="btn btn-primary" href="/">На главную</a>
    <button class="btn btn-ghost" type="button" onclick="history.length > 1 ? history.back() : location.assign('/')">Вернуться назад</button>
  </div>

  <div class="quick">
    <a href="/modpacks/">Сборки</a>
    <a href="/join/">Как играть</a>
    <a href="/rules/">Правила</a>
    <a href="/bug-report/">Сообщить о баге</a>
  </div>
</main>

<footer>
  <span>© 2026 Cloud.Seasons — Minecraft Project</span>
  <a href="https://discord.gg/EJnDZhfPxQ" target="_blank" rel="noopener noreferrer">Сообщество в Discord</a>
</footer>
</body>
</html>
